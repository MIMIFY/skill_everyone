<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>skill-everyone · /summon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080912;
      --surface:   #0f1120;
      --border:    rgba(255,255,255,0.08);
      --purple:    #8b5cf6;
      --purple-lo: rgba(139,92,246,0.15);
      --teal:      #06b6d4;
      --text:      #f1f5f9;
      --sub:       #94a3b8;
      --muted:     #475569;
      --green:     #10b981;
      --mono:      'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --sans:      'Inter', 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 260px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: rgba(15,17,32,0.8);
    }

    #sidebar-header {
      padding: 20px 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    #sidebar-header .logo {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--purple);
      letter-spacing: 1px;
    }
    #sidebar-header .tagline {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    #char-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 8px;
    }
    .char-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .char-item:hover { background: rgba(255,255,255,0.04); }
    .char-item.active { background: var(--purple-lo); border: 1px solid rgba(139,92,246,0.25); }
    .char-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 6px var(--purple);
      flex-shrink: 0;
    }
    .char-name { font-size: 14px; color: var(--text); }
    .char-slug { font-size: 11px; color: var(--muted); font-family: var(--mono); }

    #new-chat-btn {
      margin: 8px;
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed var(--border);
      background: none;
      color: var(--sub);
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    #new-chat-btn:hover { border-color: var(--purple); color: var(--purple); }

    /* ── History panel ── */
    #history-panel {
      padding: 8px 8px 0;
      border-top: 1px solid var(--border);
      max-height: 200px;
      overflow-y: auto;
    }
    .hist-label {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--mono);
      letter-spacing: 1px;
      padding: 6px 4px 4px;
      text-transform: uppercase;
    }
    .hist-session {
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: var(--sub);
      transition: background 0.12s;
    }
    .hist-session:hover { background: rgba(255,255,255,0.04); }

    /* ── User info ── */
    #user-info {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #user-info:hover { background: rgba(255,255,255,0.04); }
    #user-info .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #334155);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
    }
    #user-info .name { font-size: 13px; color: var(--sub); }
    #user-info .edit { font-size: 10px; color: var(--muted); margin-left: auto; }

    /* ── Username modal ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 340px;
      text-align: center;
    }
    .modal-box h3 { font-size: 16px; margin-bottom: 8px; }
    .modal-box p { font-size: 13px; color: var(--sub); margin-bottom: 20px; }
    .modal-input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: var(--sans);
      outline: none;
      margin-bottom: 16px;
    }
    .modal-input:focus { border-color: rgba(139,92,246,0.4); }
    .modal-btn {
      width: 100%;
      padding: 10px;
      background: var(--purple);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      font-family: var(--sans);
    }
    .modal-btn:hover { opacity: 0.9; }

    /* ── Main area ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(8,9,18,0.8);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }
    #char-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #1a1a2e, #2d1b69);
      border: 1px solid rgba(139,92,246,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    #char-title { font-size: 15px; font-weight: 500; }
    #char-subtitle { font-size: 12px; color: var(--muted); font-family: var(--mono); margin-top: 2px; }
    .online-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px rgba(16,185,129,0.6);
      margin-left: auto;
      flex-shrink: 0;
    }

    /* ── Empty state ── */
    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0.5;
    }
    #empty-state .icon { font-size: 48px; }
    #empty-state p { font-size: 14px; color: var(--sub); }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 65%;
      animation: fadeUp 0.2s ease-out;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg-row.user  { align-self: flex-end; align-items: flex-end; }
    .msg-row.assistant { align-self: flex-start; align-items: flex-start; }

    .msg-label {
      font-size: 11px;
      font-family: var(--mono);
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .user .msg-label { color: #a78bfa; }
    .assistant .msg-label { color: var(--sub); }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 4px 12px 12px 12px;
      font-size: 15px;
      line-height: 1.75;
      white-space: pre-wrap;
    }
    .user .msg-bubble {
      border-radius: 12px 4px 12px 12px;
      background: rgba(139,92,246,0.12);
      border: 1px solid rgba(139,92,246,0.25);
      color: var(--text);
    }
    .assistant .msg-bubble {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: var(--sub);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .thinking {
      display: flex; gap: 5px; padding: 14px 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 4px 12px 12px 12px;
    }
    .thinking span {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--muted);
      animation: pulse 1.2s ease-in-out infinite;
    }
    .thinking span:nth-child(2) { animation-delay: 0.2s; }
    .thinking span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.2); }
    }

    /* ── Markdown in assistant bubbles ── */
    .msg-bubble.md { white-space: normal; }
    .msg-bubble.md p { margin: 0.4em 0; }
    .msg-bubble.md p:first-child { margin-top: 0; }
    .msg-bubble.md p:last-child { margin-bottom: 0; }
    .msg-bubble.md strong { color: #c4b5fd; }
    .msg-bubble.md em { color: var(--sub); font-style: italic; }
    .msg-bubble.md code {
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.9em;
    }
    .msg-bubble.md pre {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .msg-bubble.md pre code {
      background: none;
      padding: 0;
      font-size: 13px;
    }
    .msg-bubble.md ul, .msg-bubble.md ol {
      padding-left: 1.4em;
      margin: 0.4em 0;
    }
    .msg-bubble.md blockquote {
      border-left: 3px solid var(--purple);
      padding-left: 12px;
      color: var(--sub);
      margin: 0.4em 0;
    }
    .msg-bubble.md h1, .msg-bubble.md h2, .msg-bubble.md h3 {
      font-size: 1em;
      font-weight: 600;
      margin: 0.6em 0 0.3em;
    }
    .msg-bubble.md a { color: var(--teal); text-decoration: none; }
    .msg-bubble.md a:hover { text-decoration: underline; }

    /* ── Input bar ── */
    #input-bar {
      padding: 16px 40px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      background: rgba(8,9,18,0.9);
    }
    #input-wrap {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      transition: border-color 0.15s;
    }
    #input-wrap:focus-within { border-color: rgba(139,92,246,0.4); }
    #msg-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      min-height: 24px;
      max-height: 160px;
    }
    #msg-input::placeholder { color: var(--muted); }
    #send-btn {
      width: 36px; height: 36px; flex-shrink: 0;
      background: var(--purple-lo);
      border: 1px solid rgba(139,92,246,0.35);
      border-radius: 8px;
      color: #a78bfa;
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
      align-self: flex-end;
    }
    #send-btn:hover:not(:disabled) { background: rgba(139,92,246,0.25); }
    #send-btn:disabled { opacity: 0.35; cursor: default; }

    #hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      text-align: center;
      font-family: var(--mono);
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* placeholder when no char selected */
    #no-char {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--muted);
    }
    #no-char .big { font-size: 40px; }
    #no-char p { font-size: 14px; font-family: var(--mono); }
  </style>
</head>
<body>

<!-- ── Username modal ── -->
<div class="modal-overlay" id="username-modal" style="display:none">
  <div class="modal-box">
    <h3>Welcome</h3>
    <p>Enter your display name for chat</p>
    <input class="modal-input" id="username-input" placeholder="Your name" maxlength="20" />
    <button class="modal-btn" onclick="saveUsername()">OK</button>
  </div>
</div>

<!-- ── Sidebar ── -->
<div id="sidebar">
  <div id="sidebar-header">
    <div class="logo">skill-everyone</div>
    <div class="tagline">· /summon · local web</div>
  </div>

  <div id="char-list">
    <div class="hist-label" style="padding: 8px 4px 4px">Characters</div>
    <!-- filled by JS -->
  </div>

  <button id="new-chat-btn" onclick="newChat()">+ New Chat</button>

  <div id="history-panel">
    <div class="hist-label">History</div>
    <div id="hist-list"></div>
  </div>

  <div id="user-info" onclick="showUsernameModal()">
    <div class="avatar">U</div>
    <span class="name" id="display-username">Not set</span>
    <span class="edit">edit</span>
  </div>
</div>

<!-- ── Main ── -->
<div id="main">
  <div id="topbar">
    <div id="char-avatar">&#x1f534;</div>
    <div>
      <div id="char-title">Select a character</div>
      <div id="char-subtitle">skill-everyone · web</div>
    </div>
    <div class="online-dot" id="online-dot" style="display:none"></div>
  </div>

  <div id="no-char">
    <div class="big">&#x2726;</div>
    <p>Select a character from the sidebar</p>
  </div>

  <div id="messages" style="display:none"></div>

  <div id="input-bar" style="display:none">
    <div id="input-wrap">
      <textarea id="msg-input" rows="1" placeholder="Type something..." onkeydown="onKey(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send (Enter)">&#x2191;</button>
    </div>
    <div id="hint">Enter to send · Shift+Enter for newline · History auto-saved</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@14.0.0/marked.min.js"></script>
<script>
let currentChar = null;   // { slug, name }
let sessionId   = null;   // claude session UUID
let busy        = false;
let username    = localStorage.getItem("skill-everyone-username") || null;

// Configure marked
if (typeof marked !== "undefined") {
  marked.use({ breaks: true, gfm: true });
}

// ── Username ────────────────────────────────────────────────────────────────
function showUsernameModal() {
  document.getElementById("username-modal").style.display = "flex";
  const input = document.getElementById("username-input");
  input.value = username || "";
  input.focus();
}

function saveUsername() {
  const input = document.getElementById("username-input");
  const name = input.value.trim();
  if (!name) return;
  username = name;
  localStorage.setItem("skill-everyone-username", name);
  document.getElementById("username-modal").style.display = "none";
  document.getElementById("display-username").textContent = name;
}

// ── Load characters ─────────────────────────────────────────────────────────
async function loadChars() {
  let chars;
  try {
    const res = await fetch("/api/characters");
    chars = await res.json();
  } catch (e) {
    console.error("[loadChars]", e);
    return;
  }
  const list = document.getElementById("char-list");
  // keep label
  list.innerHTML = '<div class="hist-label" style="padding:8px 4px 4px">Characters</div>';
  for (const c of chars) {
    const el = document.createElement("div");
    el.className = "char-item";
    el.dataset.slug = c.slug;
    // Build with DOM — never inject name/slug via innerHTML (XSS)
    const dot = document.createElement("div");
    dot.className = "char-dot";
    const info = document.createElement("div");
    const nameEl = document.createElement("div");
    nameEl.className = "char-name";
    nameEl.textContent = c.name;
    const slugEl = document.createElement("div");
    slugEl.className = "char-slug";
    slugEl.textContent = c.slug;
    info.append(nameEl, slugEl);
    el.append(dot, info);
    el.onclick = () => selectChar(c);
    list.appendChild(el);
  }
}

// ── Select character ────────────────────────────────────────────────────────
function selectChar(c) {
  currentChar = c;
  sessionId   = null;  // new session

  // Update sidebar highlight
  document.querySelectorAll(".char-item").forEach(el => {
    el.classList.toggle("active", el.dataset.slug === c.slug);
  });

  // Update topbar
  document.getElementById("char-title").textContent = c.name;
  document.getElementById("char-subtitle").textContent = `${c.slug} · skill-everyone · web`;
  document.getElementById("online-dot").style.display = "block";

  // Show chat area
  document.getElementById("no-char").style.display   = "none";
  document.getElementById("messages").style.display  = "flex";
  document.getElementById("input-bar").style.display = "block";

  // Clear messages
  document.getElementById("messages").innerHTML = "";
  document.getElementById("msg-input").focus();

  // Load history for this character
  loadHistory(c.slug);
}

// ── New chat (reset session, keep character) ────────────────────────────────
function newChat() {
  sessionId = null;
  if (document.getElementById("messages")) {
    document.getElementById("messages").innerHTML = "";
  }
}

// ── Send message ────────────────────────────────────────────────────────────
async function sendMessage() {
  if (busy || !currentChar) return;
  const input = document.getElementById("msg-input");
  const text  = input.value.trim();
  if (!text) return;

  input.value = "";
  autoResize(input);
  busy = true;
  document.getElementById("send-btn").disabled = true;

  // Append user bubble
  appendBubble("user", username || "You", text);

  // Append thinking indicator
  const thinkEl = appendThinking();

  try {
    const body = { message: text, character: currentChar.slug };
    if (sessionId) body.sessionId = sessionId;

    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      throw new Error(err.error || `HTTP ${res.status}`);
    }

    const reader = res.body.getReader();
    const dec    = new TextDecoder();
    let   buf    = "";
    let   asstEl = null;
    let   hasError = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) {
        // Stream closed without a proper "done" SSE event (e.g. network drop)
        thinkEl.remove();
        if (!asstEl && !hasError) appendBubble("assistant", "System", "(Connection lost, please retry)");
        break;
      }
      buf += dec.decode(value, { stream: true });

      const lines = buf.split("\n");
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        let evt;
        try { evt = JSON.parse(line.slice(6)); } catch { continue; }

        if (evt.type === "session") {
          sessionId = evt.sessionId;
        } else if (evt.type === "text") {
          if (thinkEl) thinkEl.remove();
          if (!asstEl) asstEl = appendBubble("assistant", currentChar.name, "", true);
          const bubbleEl = asstEl.querySelector(".msg-bubble");
          const cur = bubbleEl.querySelector(".cursor");
          if (cur) cur.remove();
          bubbleEl.appendChild(document.createTextNode(evt.text));
          bubbleEl.appendChild(makeCursor());
          scrollBottom();
        } else if (evt.type === "error") {
          if (thinkEl) thinkEl.remove();
          hasError = true;
          appendBubble("assistant", "System", `Error: ${evt.error}`);
        } else if (evt.type === "done") {
          if (asstEl) {
            const cur = asstEl.querySelector(".cursor");
            if (cur) cur.remove();
            // Render markdown now that streaming is complete
            const bubbleEl = asstEl.querySelector(".msg-bubble");
            if (typeof marked !== "undefined" && bubbleEl) {
              const rawText = bubbleEl.textContent;
              bubbleEl.classList.add("md");
              bubbleEl.innerHTML = marked.parse(rawText);
            }
          } else if (!hasError) {
            // done fired but no text ever arrived (and no error was shown)
            if (thinkEl) thinkEl.remove();
            appendBubble("assistant", "System", "(No response, please retry)");
          }
          loadHistory(currentChar.slug);
        }
      }
    }
  } catch (e) {
    thinkEl && thinkEl.remove();
    appendBubble("assistant", "System", `Error: ${e.message}`);
  }

  busy = false;
  document.getElementById("send-btn").disabled = false;
  document.getElementById("msg-input").focus();
}

// ── DOM helpers ─────────────────────────────────────────────────────────────
function appendBubble(side, label, text, withCursor = false) {
  const msgs   = document.getElementById("messages");
  const row    = document.createElement("div");
  row.className = `msg-row ${side}`;
  const labelEl  = document.createElement("div");
  labelEl.className = "msg-label";
  labelEl.textContent = label;
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble";
  if (text) {
    // Render markdown for completed assistant messages only
    if (side === "assistant" && !withCursor && typeof marked !== "undefined") {
      bubble.classList.add("md");
      bubble.innerHTML = marked.parse(text);
    } else {
      bubble.appendChild(document.createTextNode(text));
    }
  }
  if (withCursor) bubble.appendChild(makeCursor());
  row.append(labelEl, bubble);
  msgs.appendChild(row);
  scrollBottom();
  return row;
}

function appendThinking() {
  const msgs    = document.getElementById("messages");
  const row     = document.createElement("div");
  row.className = "msg-row assistant";
  const labelEl = document.createElement("div");
  labelEl.className = "msg-label";
  labelEl.textContent = currentChar?.name || "";
  const dots = document.createElement("div");
  dots.className = "thinking";
  dots.innerHTML = "<span></span><span></span><span></span>"; // safe: no user data
  row.append(labelEl, dots);
  msgs.appendChild(row);
  scrollBottom();
  return row;
}

function makeCursor() {
  const c = document.createElement("span");
  c.className = "cursor";
  return c;
}

function scrollBottom() {
  const msgs = document.getElementById("messages");
  msgs.scrollTop = msgs.scrollHeight;
}

// ── History ─────────────────────────────────────────────────────────────────
async function loadHistory(slug) {
  let sessions;
  try {
    const res = await fetch(`/api/history/${slug}`);
    sessions = await res.json();
  } catch (e) {
    console.error("[loadHistory]", e);
    return;
  }
  const list     = document.getElementById("hist-list");
  list.innerHTML = "";

  for (const s of sessions) {
    const el = document.createElement("div");
    el.className = "hist-session";
    const preview = s.messages[0]?.content?.slice(0, 24) || "(empty)";
    el.textContent = `${s.date}  ${preview}...`;
    el.title = `${s.messages.length} messages · ${s.session.slice(0, 8)}`;
    el.onclick = () => loadSessionIntoChat(s.messages);
    list.appendChild(el);
  }
}

function loadSessionIntoChat(messages) {
  const msgs = document.getElementById("messages");
  msgs.innerHTML = "";
  sessionId = null;  // view only — start a fresh session if user replies

  for (const m of messages) {
    const label = m.role === "user" ? (username || "You") : (currentChar?.name || "Character");
    appendBubble(m.role === "user" ? "user" : "assistant", label, m.content);
  }
}

// ── Keyboard / resize ───────────────────────────────────────────────────────
function onKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}

// ── Init ────────────────────────────────────────────────────────────────────
if (!username) {
  showUsernameModal();
} else {
  document.getElementById("display-username").textContent = username;
}

document.getElementById("username-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") saveUsername();
});

loadChars();
</script>
</body>
</html>
